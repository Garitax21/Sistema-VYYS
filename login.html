<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VYY'S - Inicio de sesión.">
    <title>Iniciar sesión | VYY'S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/auth.js"></script>
</head>
<body>

    <header>
        <div class="marca">
            <img src="img/logo.png" alt="Logo de VYY'S">
            <div>
                <h1>VYY'S</h1>
                <p>Elegancia para cada día</p>
            </div>
        </div>
    </header>

    <main>
        <section class="contenedor">
            <div class="login-caja">
                <h2>Iniciar sesión</h2>
                <hr class="linea-dorada">
                <p class="subtitulo">Ingresa con tu usuario para entrar al sitio de VYY'S.</p>

                <form id="formLogin" novalidate>
                    <label for="loginUsuario">Usuario o correo:</label>
                    <input type="text" id="loginUsuario" name="usuario" autocomplete="username" placeholder="Usuario o correo">

                    <label for="loginClave">Contraseña:</label>
                    <input type="password" id="loginClave" name="clave" autocomplete="current-password">

                    <label class="ver-clave" for="verClave">
                        <input type="checkbox" id="verClave"> Mostrar contraseña
                    </label>

                    <p class="msg-error" id="errorLogin" role="alert"></p>

                    <button type="submit">Entrar</button>
                </form>

                <p class="enlace-alterno">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </section>
    </main>

    <footer>
        <h3>VYY'S</h3>
        <p>Moda · Estilo</p>
        <p class="copy">&copy; <span id="anio">2026</span> VYY'S. Todos los derechos reservados.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
